<body>
<div id="sideMenu" style="position:fixed; top:0; left:-250px; width:250px; height:100%; background:#39326C; z-index:20001; transition: 0.3s; padding-top: 60px; box-shadow: 5px 0 15px rgba(0,0,0,0.3);">
  
  <button onclick="toggleMenu()" style="position:absolute; top:20px; right:20px; background:none; border:none; color:white; font-size:30px; cursor:pointer;">&times;</button>

  <div style="display:flex; flex-direction:column; gap:20px; padding-left:30px;">

    <a href="#" onclick="goToSales(); toggleMenu();" style="color:white; text-decoration:none; font-size:24px; font-family:sans-serif; font-weight:bold;">Summary</a>

</div>

<div id="menuShadow" onclick="toggleMenu()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:20000;"></div>
<div class="layout">

    <!-- MAIN CONTENT AREA -->
    <div class="main-content">

    <button class="product-tile blue" onclick="openCategory('Burgers')">Burgers</button>
    <button class="product-tile blue" onclick="openCategory('Wraps')">Wraps</button>

      </div>

<script>
let originalGrid = "";
let cart = [];
let currentEditingIndex = null;



// NEW: Initialize daily totals
// Replace your old dailySales line with this:
let dailySales = JSON.parse(localStorage.getItem("dailySales")) || { 
  total: 0, 
  count: 0, 
  cash: 0, 
  card: 0 
};

window.onload = function () {
  originalGrid = document.getElementById("productGrid").innerHTML;
};

function goHome() {
  document.getElementById("productGrid").innerHTML = originalGrid;
}
function goback() {
 document.getElementById("productGrid").innerHTML = originalGrid;
 
}
// --- SIDEBAR NAVIGATION LOGIC ---

function toggleMenu() {
  const menu = document.getElementById("sideMenu");
  const shadow = document.getElementById("menuShadow");

  if (menu.style.left === "0px") {
    menu.style.left = "-250px"; // Hide it
    shadow.style.display = "none";
  } else {
    menu.style.left = "0px"; // Slide it out
    shadow.style.display = "block";
  }
}

function printDirect() {
    if (cart.length === 0) return;

    let receiptText = "      TENNESSEE EXPRESS\n";
    receiptText += "         CHICKEN SHOP\n";
    receiptText += "================================\n";
    receiptText += `Date: ${new Date().toLocaleString()}\n`;
    receiptText += "--------------------------------\n";

    let total = 0;

    cart.forEach(item => {
        let name = item.name.substring(0, 20).padEnd(18, ' ');
        // We use "GBP" instead of the symbol
        let price = "GBP " + item.price.toFixed(2); 
        receiptText += `${name} ${price.padStart(12, ' ')}\n`;
        
        if (item.mods && item.mods.length > 0) {
            item.mods.forEach(mod => {
                receiptText += `  - ${mod}\n`;
            });
        }
        total += item.price;
    });

    receiptText += "--------------------------------\n";
    receiptText += `TOTAL:        GBP ${total.toFixed(2).padStart(15, ' ')}\n`;
    receiptText += "================================\n";
    receiptText += "\n   Thank you for your order!\n\n\n\n\n";

    const base64Data = btoa(unescape(encodeURIComponent(receiptText)));
    window.location.href = "rawbt:base64," + base64Data;
}
function goBack() {
    // If you just want to go back to the main menu, call goHome
    goHome();
}
// Ensure this is at the very bottom of your script
document.querySelector(".print-btn").onclick = printDirect;
// Update your existing 3-line button to call toggleMenu instead
function goToSales() {
  // 1. Update the numbers from our daily record
  document.getElementById("sumTotal").innerText = "£" + dailySales.total.toFixed(2);
  document.getElementById("sumCard").innerText = "£" + dailySales.card.toFixed(2);
  document.getElementById("sumCash").innerText = "£" + dailySales.cash.toFixed(2);

  // 2. Show the summary page
  document.getElementById("summaryPage").style.display = "block";
}
function closeSummary() {
  // Hide the summary page to return to the POS
  document.getElementById("summaryPage").style.display = "none";
}
function resetDay() {
  if (confirm("This will wipe all sales for today. Are you sure?")) {
    dailySales = { total: 0, count: 0, cash: 0, card: 0 };
    
    // CLEAR BROWSER STORAGE
    localStorage.removeItem("dailySales");
    
    goToSales(); // Refresh the display
    alert("Totals reset to £0.00");
  }
}
async function resetDay() {
  if (confirm("This will email the report and wipe all sales. Are you sure?")) {
    
    // 1. Prepare the data for the email
    const templateParams = {
      total_sales: "£" + dailySales.total.toFixed(2),
      cash_sales: "£" + dailySales.cash.toFixed(2),
      card_sales: "£" + dailySales.card.toFixed(2),
      date: new Date().toLocaleString()
    };

    try {
      // 2. Send the email 
      // Replace "YOUR_SERVICE_ID" and "YOUR_TEMPLATE_ID" with your EmailJS IDs
      await emailjs.send('service_iietyup', 'template_rrzeeit', templateParams);
      alert("Report sent successfully!");

      // 3. Reset the data ONLY after the email is sent
      dailySales = { total: 0, count: 0, cash: 0, card: 0 };
      localStorage.removeItem("dailySales");
      goToSales(); 
      alert("Totals reset to £0.00");

    } catch (error) {
      console.error("Email failed...", error);
      alert("Failed to send email. Totals were NOT reset.");
    }
  }
}


function addToCart(name, price) {
  cart.push({ name: name, price: price, mods: [] });
  updateCheckout();
}

function removeItem(index) {
  cart.splice(index, 1);
  updateCheckout();
}

function clearCart() {
  cart = [];
  updateCheckout();
}

function updateCheckout() {
  const cartItemsDiv = document.querySelector(".items");
  const itemCountDiv = document.querySelector(".item-count");
  const totalPriceDiv = document.querySelector(".total");

  cartItemsDiv.innerHTML = "";
  let total = 0;

  cart.forEach((item, index) => {
    total += item.price;
    let modsDisplay = item.mods.length > 0 ? `<div style="font-size:12px; color:red; font-style:italic;">${item.mods.join(", ")}</div>` : "";

    cartItemsDiv.innerHTML += `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee; background:#fff; margin-bottom:5px;">
        <div style="display:flex; flex-direction:column;">
          <span style="font-weight:bold; color:#000;">${item.name}</span>
          ${modsDisplay}
          <span style="font-size:14px; color:#444;">£${item.price.toFixed(2)}</span>
        </div>
        <div style="display:flex; gap:10px;">
          <button onclick="openMod(${index})" style="background:none; border:none; font-size:20px; cursor:pointer;">✏️</button>
          <button onclick="removeItem(${index})" style="background:none; border:none; font-size:20px; cursor:pointer;">🗑️</button>
        </div>
      </div>`;
  });

  itemCountDiv.innerText = "Items: " + cart.length;
  totalPriceDiv.innerText = "Total: £" + total.toFixed(2);
}

// CUSTOMIZATION
function openMod(index) {
  currentEditingIndex = index;
  document.getElementById("modItemName").innerText = "Modify: " + cart[index].name;
  document.getElementById("customModal").style.display = "block";
}

function closeMod() {
  document.getElementById("customModal").style.display = "none";
}

function addMod(tag) {
  if (currentEditingIndex !== null) {
    cart[currentEditingIndex].mods.push(tag);
    updateCheckout();
    closeMod();
  }
}

// PAYMENT
function openPayModal() {
  if (cart.length === 0) { alert("Cart is empty!"); return; }
  let total = cart.reduce((sum, item) => sum + item.price, 0);
  document.getElementById("payTotalDisplay").innerText = "£" + total.toFixed(2);
  document.getElementById("payModal").style.display = "flex";
}

function closePayModal() {
  document.getElementById("payModal").style.display = "none";
}

function finalizeSale(method) {
  let orderTotal = cart.reduce((sum, item) => sum + item.price, 0);

  // Update the object
  dailySales.total += orderTotal;
  if (method === 'CASH') dailySales.cash += orderTotal;
  if (method === 'CARD') dailySales.card += orderTotal;

  // SAVE TO BROWSER STORAGE
  localStorage.setItem("dailySales", JSON.stringify(dailySales));

  alert("Sale Complete via " + method);
  cart = [];
  updateCheckout();
  closePayModal();
  goHome();
  
}
// DELETE THIS PART ENTIRELY
function createBtn(name, price, desc = "") {
    // This allows for the description line to exist only if you provide one
    const descriptionLine = desc ? `<span style="font-size:18px !important; color:#666; display:block;">(${desc})</span>` : "";

    return `
    <button class="product-item" onclick="addToCart('${name}', ${price})">
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; width:100%;">
        <span style="font-size:32px !important; font-weight:bold; line-height:1.1; display:block;">${name}</span>
        ${descriptionLine}
        <span style="font-size:28px !important; color:#cc0000; font-weight:bold; display:block;">£${price.toFixed(2)}</span>
      </div>
    </button>`;
}

function clearCart() {
  if (confirm("Are you sure you want to clear the current order?")) {
    cart = [];

  }
}
function printEndOfDayReport() {
    let reportText = "    TENNESSEE EXPRESS\n";
    reportText += "    END OF DAY REPORT\n";
    reportText += "================================\n";
    reportText += `Date: ${new Date().toLocaleDateString()}\n`;
    reportText += `Time: ${new Date().toLocaleTimeString()}\n`;
    reportText += "--------------------------------\n";
    
    reportText += `TOTAL SALES:     GBP ${dailySales.total.toFixed(2).padStart(10, ' ')}\n`;
    reportText += `CASH TOTAL:      GBP ${dailySales.cash.toFixed(2).padStart(10, ' ')}\n`;
    reportText += `CARD TOTAL:      GBP ${dailySales.card.toFixed(2).padStart(10, ' ')}\n`;
    reportText += `TOTAL ORDERS:    ${dailySales.count.toString().padStart(14, ' ')}\n`;
    
    reportText += "--------------------------------\n";
    reportText += "     End of Report\n\n\n\n\n";

    // Convert to Base64 for RawBT printing
    const base64Data = btoa(unescape(encodeURIComponent(reportText)));
    window.location.href = "rawbt:base64," + base64Data;
}

    <button class="mod-btn" onclick="addMod('No Ketchup')" style="padding:30px; font-size:18px; font-weight:bold; border-radius:10px; border:none; cursor:pointer;">No Ketchup</button>
    <button class="mod-btn" onclick="addMod('No Lettuce')" style="padding:30px; font-size:18px; font-weight:bold; border-radius:10px; border:none; cursor:pointer;">No Lettuce</button>
    <button class="mod-btn" onclick="addMod('No Cheese')" style="padding:30px; font-size:18px; font-weight:bold; border-radius:10px; border:none; cursor:pointer;">No Cheese
    <button class="mod-btn" onclick="addMod(' Extra Cheese')" style="padding:30px; font-size:18px; font-weight:bold; border-radius:10px; border:none; cursor:pointer;">Extra Cheese</button>  
    </button>
    
  </div>
</div>

<div id="payModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:10001; align-items:center; justify-content:center;">
  <div style="background:white; width:500px; padding:50px; border-radius:20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align:center; font-family: sans-serif;">
    <h1 style="color:#333; font-size: 20px; margin:0;">Total Amount</h1>
    <div id="payTotalDisplay" style="font-size: 70px; font-weight: bold; color: #000; margin: 20px 0 40px 0;">£0.00</div>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:40px;">
      <button onclick="finalizeSale('CASH')" style="background-color:#4B43A6; color:white; border:none; padding:20px; font-size:22px; font-weight:bold; border-radius:10px; cursor:pointer;">CASH</button>
      <button onclick="finalizeSale('CARD')" style="background-color:#4B43A6; color:white; border:none; padding:20px; font-size:22px; font-weight:bold; border-radius:10px; cursor:pointer;">CARD</button>
    </div>

    <button onclick="closePayModal()" style="background-color:#cc0000; color:white; border:none; padding:12px 30px; font-size:16px; font-weight:bold; border-radius:8px; cursor:pointer;">CLOSE</button>
  </div>
  
</div>

</body>
